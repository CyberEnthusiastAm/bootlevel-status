# Boot Level status: https://status.bootlevel.com
# Checked from GitHub's servers, outside our own, so this page stays up when bootlevel.com is down.
owner: CyberEnthusiastAm # where this repository lives
repo: bootlevel-status # the name of this repository

sites:
  - name: Website
    url: https://bootlevel.com
  - name: Health check
    url: https://bootlevel.com/api/health

# Incident issues are assigned here, so GitHub notifies the owner as well as UptimeRobot.
assignees:
  - CyberEnthusiastAm

status-website:
  cname: status.bootlevel.com
  logoUrl: https://raw.githubusercontent.com/CyberEnthusiastAm/bootlevel-status/master/assets/bootlevel.svg
  favicon: https://raw.githubusercontent.com/CyberEnthusiastAm/bootlevel-status/master/assets/bootlevel.svg
  name: Boot Level status
  theme: dark
  introTitle: "**Boot Level** service status"
  introMessage: Live uptime and response times for [bootlevel.com](https://bootlevel.com), checked every few minutes from outside our own servers.
  navbar:
    - title: Status
      href: /
    - title: Boot Level
      href: https://bootlevel.com
